<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Start your 360° MDL review</title>
<meta name="description" content="A free, guided planner for literature reviews with the 360° MDL method. Answer a few questions and get your review protocol, search strings for every database, a stream plan, a timeline and a pre-filled Excel toolkit.">
<meta property="og:title" content="Start your 360° MDL review">
<meta property="og:description" content="Plan a 360° MDL literature review in 15 minutes: protocol, search strings, stream plan, timeline and pre-filled toolkit. Free, runs in your browser.">
<meta property="og:image" content="logo.png">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Lora:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#F5F7F9;--surface:#fff;--surface2:#F9FAFB;--fg:#17202E;--muted:#5E6B7C;--line:#D9DFE6;
  --navy:#14213D;--accent:#0F7C8C;--accent-ink:#0B6370;--accent-soft:#E2F1F3;
  --good:#1C7A5F;--good-soft:#E0F2EA;--amber:#9A6420;--amber-soft:#FBF1E1;--coral:#B8452F;--coral-soft:#F9E6E1;
  --f1:#1F4E79;--f2:#7B3F99;--f3:#C9862A;--f4:#2A9D8F;--f5:#C8553D;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--serif:'Lora',Georgia,serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1623;--surface:#172033;--surface2:#1B2539;--fg:#E7ECF2;--muted:#9AA7B8;--line:#2A3547;--navy:#E7ECF2;--accent:#5CC3D0;--accent-ink:#8FD8E1;--accent-soft:#163740;
  --good:#6FD3AE;--good-soft:#173A30;--amber:#E0B06A;--amber-soft:#3A2E17;--coral:#F09A85;--coral-soft:#3D2420;}}
:root[data-theme="dark"]{--bg:#0F1623;--surface:#172033;--surface2:#1B2539;--fg:#E7ECF2;--muted:#9AA7B8;--line:#2A3547;--navy:#E7ECF2;--accent:#5CC3D0;--accent-ink:#8FD8E1;--accent-soft:#163740;
  --good:#6FD3AE;--good-soft:#173A30;--amber:#E0B06A;--amber-soft:#3A2E17;--coral:#F09A85;--coral-soft:#3D2420;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{background:#14213D;color:#fff;position:sticky;top:0;z-index:20}
.top .in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.top .brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:700}
.top .brand img{width:30px;height:30px;border-radius:50%;background:#fff}
.top .sp{flex:1}
.top .tlink{color:#CFE3E8;text-decoration:none;font-size:.9rem;font-weight:500}
.top .tlink:hover{color:#fff}
.savechip{font-size:.78rem;color:#9FC9D1;white-space:nowrap}
@media(max-width:640px){.top .tlink.hide-sm,.savechip,.top .dot{display:none}.top .in{gap:10px}}
@media(max-width:400px){.top .brand span{display:none}}

/* layout */
.page{max-width:1240px;margin:0 auto;padding:22px 16px 80px;display:grid;grid-template-columns:250px minmax(0,1fr) 290px;gap:22px;align-items:start}
@media(max-width:1100px){.page{grid-template-columns:220px minmax(0,1fr)}.health{grid-column:2}}
@media(max-width:820px){.page{grid-template-columns:1fr}.health{grid-column:auto}.rail{display:none}}

/* step rail */
.rail{position:sticky;top:70px;display:flex;flex-direction:column;gap:2px}
@media(max-width:820px){.rail{display:none!important}}
.rail .rt{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 12px}
.rail button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:9px;color:var(--muted);font-weight:500;font-size:.92rem}
.rail button:hover{background:var(--surface)}
.rail button .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;border:1.5px solid var(--line);flex:none;background:var(--surface)}
.rail button[aria-current="step"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 0 var(--line)}
.rail button[aria-current="step"] .n{background:var(--accent);border-color:var(--accent);color:#fff}
.rail button.done .n{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-ink)}
.rail button:focus-visible{outline:2px solid var(--accent)}

/* mobile progress */
.mprog{display:none}
@media(max-width:820px){.mprog{display:block;margin-bottom:6px}}
.mprog .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.mprog .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.mprog .lab{font-size:.82rem;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;min-width:0}
@media(max-width:640px){.card{padding:20px 16px}}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.6rem,4vw,2.15rem);line-height:1.2;color:var(--navy);margin:6px 0 10px}
h2{font-family:var(--serif);font-weight:600;font-size:1.45rem;color:var(--navy);margin:4px 0 6px}
h3{font-size:1rem;font-weight:700;margin:22px 0 8px}
.lead{color:var(--muted);margin:0 0 18px;max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.hint{font-size:.84rem;color:var(--muted);margin:4px 0 0}

/* fields */
.field{display:grid;gap:6px;margin-bottom:16px;align-content:start}
.field>label,.lbl{font-weight:600;font-size:.92rem}
.field .opt{font-weight:400;color:var(--muted);font-size:.82rem}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:72px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:640px){.row2,.row3{grid-template-columns:1fr}}

/* choice cards */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:8px 0 18px}
.choice{position:relative;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;background:var(--surface);transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--accent)}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice b{display:block;font-size:1rem;margin-bottom:2px}
.choice span{display:block;font-size:.85rem;color:var(--muted)}
.choice .tag{display:inline-block;margin-top:8px;font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice:has(input:checked) .tag{background:var(--accent);color:#fff}
.choice:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.reco{display:inline-block;font-size:.7rem;font-weight:700;color:var(--good);background:var(--good-soft);padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:2px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:.88rem;background:var(--surface);user-select:none}
.chip input{accent-color:var(--accent);margin:0}
.chip:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem;cursor:pointer;text-decoration:none;color:var(--fg);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
:root[data-theme="dark"] .btn.primary,:root:not([data-theme="light"]) .btn.primary{color:#fff}
.btn.ghost{background:transparent}
.btn.small{padding:6px 11px;font-size:.82rem}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 0}
.btn:disabled{opacity:.5;cursor:default}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.nav .step-of{font-size:.85rem;color:var(--muted)}

/* concept blocks / list editors */
.block{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:var(--surface2)}
.block .bh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.block .bn{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:.8rem;color:#fff;flex:none}
.listed{display:grid;gap:8px}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start}
.li .k{font-family:var(--mono);font-size:.8rem;font-weight:600;color:var(--muted);padding-top:11px;min-width:34px}
.li .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.2rem;line-height:1;padding:9px 6px;border-radius:6px}
.li .x:hover{color:var(--coral);background:var(--coral-soft)}
.rq{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface2)}
.rq .rqh{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.rq .rqh select{width:auto;padding:6px 10px;font-size:.85rem}
.rq .rqh .k{font-family:var(--mono);font-weight:700;font-size:.85rem}
.rq .rqh .sp{flex:1}
.cl{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px;align-items:start}
@media(max-width:640px){.cl{grid-template-columns:40px 1fr auto}.cl .kw{grid-column:2/3}}

/* streams */
.appr{margin:18px 0 6px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.appr h3{margin:0}
.stream{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;background:var(--surface);transition:background .15s}
.stream.on{background:var(--surface2)}
.stream input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin-top:2px}
.stream .sn{font-weight:600}
.stream .sd{font-size:.84rem;color:var(--muted)}
.stream .sl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stream .sl label{font-size:.78rem;border:1px solid var(--line);border-radius:99px;padding:3px 9px;display:inline-flex;gap:5px;align-items:center;cursor:pointer;background:var(--surface)}
.stream .sl input{accent-color:var(--accent);margin:0}
.stream .sl label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.fam{display:inline-block;font-size:.68rem;font-weight:700;color:#fff;border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.f1{background:var(--f1)}.f2{background:var(--f2)}.f3{background:var(--f3)}.f4{background:var(--f4)}.f5{background:var(--f5)}
.bl1{border-left-color:var(--f1)!important}.bl2{border-left-color:var(--f2)!important}.bl3{border-left-color:var(--f3)!important}.bl4{border-left-color:var(--f4)!important}.bl5{border-left-color:var(--f5)!important}

/* health panel */
.health{position:sticky;top:70px;display:flex;flex-direction:column;gap:12px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hcard h4{margin:0 0 10px;font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.check{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:.86rem;padding:5px 0;align-items:start}
.check .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;font-weight:800;margin-top:2px}
.check.ok .ic{background:var(--good-soft);color:var(--good)}
.check.warn .ic{background:var(--amber-soft);color:var(--amber)}
.check.bad .ic{background:var(--coral-soft);color:var(--coral)}
.check .ct{color:var(--fg)}
.check .cs{display:block;color:var(--muted);font-size:.78rem}
.ring{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.ring svg{flex:none}
.ring b{font-size:1.05rem}
.famsbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line);margin:8px 0 6px}
.famsbar i{display:block;height:100%}
.famleg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.74rem;color:var(--muted)}
.famleg span{display:inline-flex;align-items:center;gap:4px}
.famleg i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* notes */
.note{border-radius:10px;padding:12px 14px;font-size:.88rem;margin:10px 0 16px;background:var(--accent-soft);color:var(--fg)}
.note.amber{background:var(--amber-soft)}
.note b{font-weight:700}

/* welcome */
.hero-in{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:24px;align-items:center}
@media(max-width:640px){.hero-in{grid-template-columns:1fr}.hero-in .lg{display:none}}
.hero-in .lg img{width:100%;border-radius:50%;box-shadow:0 12px 40px rgba(20,33,61,.25)}
.gets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:18px 0}
.get{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface2)}
.get .gi{font-size:1.3rem;line-height:1}
.get b{display:block;margin:6px 0 2px}
.get span{font-size:.84rem;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.86rem;color:var(--muted);margin-top:6px}
.facts span::before{content:"✓ ";color:var(--good);font-weight:700}

/* results */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{all:unset;cursor:pointer;padding:10px 12px;font-weight:600;font-size:.9rem;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.dls{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:12px 0 20px}
.dl{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.dl .dt{font-weight:700}
.dl .dd{font-size:.84rem;color:var(--muted);flex:1}
.dl.main{border-color:var(--accent);background:var(--accent-soft)}
.qs{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.qs .qh{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.qs .qh b{flex:1;min-width:140px}
.qs pre{margin:0;padding:12px 14px;font-family:var(--mono);font-size:.8rem;white-space:pre-wrap;word-break:break-word;background:var(--surface)}
.qs .qn{padding:0 14px 12px;font-size:.82rem;color:var(--muted);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th,table.t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tw{overflow-x:auto}
.gantt{display:grid;gap:6px;margin:10px 0}
.gr{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center;font-size:.86rem}
@media(max-width:640px){.gr{grid-template-columns:110px minmax(0,1fr)}}
.gtrack{position:relative;height:26px;background:var(--surface2);border-radius:6px;border:1px solid var(--line)}
.gbar{position:absolute;top:3px;bottom:3px;border-radius:5px;background:var(--accent);color:#fff;font-size:.72rem;font-weight:600;display:flex;align-items:center;padding:0 6px;white-space:nowrap;overflow:hidden}
.gcp{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--coral)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:#14213D;color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;transition:.25s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.footer{grid-column:1/-1;font-size:.82rem;color:var(--muted);text-align:center;margin-top:10px}
.pv{font-size:.92rem}
.pv h3{font-family:var(--serif);font-size:1.1rem;color:var(--navy);margin:20px 0 6px}
.pv p{margin:4px 0}
#print{display:none}
@media print{
  body{background:#fff;color:#000}
  .top,.page,.toast{display:none!important}
  #print{display:block;font-family:Georgia,serif;font-size:11pt;line-height:1.45;color:#000;padding:0}
  #print h1{font-size:20pt;color:#14213D}
  #print h3{font-size:13pt;color:#14213D;margin:16pt 0 4pt;page-break-after:avoid}
  #print table{width:100%;border-collapse:collapse;font-size:9.5pt;margin:4pt 0}
  #print th,#print td{border:1px solid #999;padding:3pt 5pt;text-align:left;vertical-align:top}
  #print pre{white-space:pre-wrap;font-size:8.5pt;border:1px solid #ccc;padding:5pt;background:#f6f6f6}
  @page{margin:18mm}
}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="index.html"><img src="logo.png" alt=""><span>360° MDL</span></a>
  <span class="dot" style="color:#9FC9D1;font-size:.9rem" aria-hidden="true">·</span>
  <span style="font-weight:600">Review Starter</span>
  <span class="sp"></span>
  <span class="savechip" id="savechip" aria-live="polite"></span>
  <a class="tlink hide-sm" href="calculator.html">Calculator</a>
  <a class="tlink hide-sm" href="navigator.html">Navigator</a>
  <a class="tlink" href="index.html">Home</a>
</div></header>

<div class="page">
  <nav class="rail" aria-label="Steps"><div class="rt">Your plan in 8 steps</div><div id="rail"></div></nav>
  <main>
    <div class="mprog"><div class="bar"><i id="mbar"></i></div><div class="lab"><span id="mlab"></span><span id="mpct"></span></div></div>
    <section class="card" id="stage" aria-live="polite"></section>
  </main>
  <aside class="health" id="health" aria-label="Plan check"></aside>
  <div class="footer">360° MDL Review Starter v1.0 · Everything stays in your browser; nothing is sent anywhere. · Method: Lytras, M. D. (2026). <i>360° MDL — Version 2026</i>. <a href="https://doi.org/10.5281/zenodo.23724393">doi:10.5281/zenodo.23724393</a> · CC BY 4.0</div>
</div>
<div id="print"></div>

// ---------------------------------------------------------------- search strings
function qterm(t){t=t.trim();if(!t)return "";if(/^".*"$/.test(t))return t;if(/[\s\-\/]/.test(t)&&!/[*?]/.test(t))return `"${t}"`;return t}
function blocks(){return S.concepts.map(c=>terms(c.terms)).filter(a=>a.length)}
function orb(a,f){return "("+a.map(t=>f?f(qterm(t)):qterm(t)).join(" OR ")+")"}
function boolStr(){const b=blocks();return b.length?b.map(a=>orb(a)).join(" AND "):"(…add your terms in step 3…)"}
function langScopus(){return (S.languages||["English"]).map(l=>`LIMIT-TO ( LANGUAGE , "${l}" )`).join(" OR ")}
function scopus(y0,y1,extra){return `TITLE-ABS-KEY ( ${boolStr()}${extra?" AND "+extra:""} ) AND PUBYEAR > ${y0-1} AND PUBYEAR < ${y1+1} AND ( LIMIT-TO ( DOCTYPE , "ar" ) OR LIMIT-TO ( DOCTYPE , "re" ) ) AND ( ${langScopus()} )`}
function wos(y0,y1){return `TS=(${boolStr()}) AND PY=(${y0}-${y1}) AND DT=(Article OR Review) AND LA=(${(S.languages||["English"]).join(" OR ")})`}
function pubmed(y0,y1){const b=blocks();return (b.length?b.map(a=>orb(a,t=>t+"[tiab]")).join(" AND "):"(…)")+` AND ("${y0}"[dp] : "${y1}"[dp])`}
const nostar=t=>qterm(t.replace(/\*/g,"").trim());
function gsQ(){const b=blocks();return b.map(a=>a.length>1?"("+a.slice(0,4).map(nostar).join(" OR ")+")":nostar(a[0])).join(" ")}
function gsURL(y0,y1){return `https://scholar.google.com/scholar?q=${encodeURIComponent(gsQ())}&as_ylo=${y0}&as_yhi=${y1}`}
function webQ(sites){const b=blocks();const core=b.slice(0,2).map(a=>a.length>1?"("+a.slice(0,3).map(nostar).join(" OR ")+")":nostar(a[0])).join(" ");return `${core} (${sites.map(s=>"site:"+s).join(" OR ")}) filetype:pdf`}
const IND_SITES=["mckinsey.com","bcg.com","bain.com","deloitte.com","pwc.com","ey.com","kpmg.com","accenture.com","gartner.com","weforum.org"];
const GOV_SITES=["oecd.org","worldbank.org","un.org","undp.org","unesco.org","who.int","imf.org","europa.eu","itu.int"];
function oaURL(params){const b=blocks();const s=b.length?b.map(a=>"("+a.map(t=>t.includes(" ")&&!/^"/.test(t)?`"${t}"`:t.replace(/\*/g,"")).join(" OR ")+")").join(" AND "):"";
  const f=params.filter.join(",");return `https://api.openalex.org/works?search=${encodeURIComponent(s)}&filter=${encodeURIComponent(f).replace(/%2C/g,",").replace(/%3A/g,":").replace(/%7C/g,"|")}&sort=${params.sort||"cited_by_count:desc"}&per-page=100`}
function queriesFor(code){const y0=+S.y0,y1=+S.y1,st=S.streams[code]||{slices:[]},q=[];const has=sl=>st.slices.includes(sl);
 if(code==="SCO"){if(has("IMP"))q.push({sl:"IMP",db:"Scopus",s:scopus(y0,y1),n:`Sort by “Cited by (highest)”; export the first ${quota(STREAMS[1],"IMP")} as CSV with abstracts.`,url:"https://www.scopus.com/search/form.uri?display=advanced"});
   if(has("REC"))q.push({sl:"REC",db:"Scopus",s:scopus(Math.max(y0,y1-1),y1),n:`Last two years. Sort by citations; export ${quota(STREAMS[1],"REC")}.`,url:"https://www.scopus.com/search/form.uri?display=advanced"});
   if(has("FRO"))q.push({sl:"FRO",db:"Scopus",s:scopus(Math.max(y0,y1-4),y1),n:`Last five years. Keep papers from special issues (check the issue title); export ${quota(STREAMS[1],"FRO")}.`,url:"https://www.scopus.com/search/form.uri?display=advanced"})}
 if(code==="WOS"){if(has("IMP"))q.push({sl:"IMP",db:"Web of Science",s:wos(y0,y1),n:`Advanced search. Sort by “Citations: highest first”; export ${quota(STREAMS[0],"IMP")} (Full Record).`,url:"https://www.webofscience.com/wos/woscc/advanced-search"});
   if(has("REC"))q.push({sl:"REC",db:"Web of Science",s:wos(Math.max(y0,y1-1),y1),n:`Last two years; export ${quota(STREAMS[0],"REC")}.`,url:"https://www.webofscience.com/wos/woscc/advanced-search"});
   if(has("FRO"))q.push({sl:"FRO",db:"Web of Science",s:wos(Math.max(y0,y1-4),y1),n:`Last five years, special-issue papers; export ${quota(STREAMS[0],"FRO")}.`,url:"https://www.webofscience.com/wos/woscc/advanced-search"})}
 if(code==="GSC")q.push({sl:"TOP",db:"Google Scholar",s:gsQ(),n:`Opens with your years. Take the top ${quota(STREAMS[2],"TOP")} by citations; Scholar has no export, so record title + DOI.`,url:gsURL(y0,y1)});
 if(code==="DOM"){q.push({sl:"IMP/REC",db:"PubMed (health)",s:pubmed(y0,y1),n:"For health and life sciences. For IEEE Xplore, ACM DL or ERIC paste the generic Boolean string below.",url:"https://pubmed.ncbi.nlm.nih.gov/?term="+encodeURIComponent(pubmed(y0,y1))});
   q.push({sl:"IMP/REC",db:"Generic Boolean (IEEE, ACM, ERIC …)",s:boolStr(),n:"Paste into the advanced search of your domain database; limit to the same years and document types."})}
 if(code==="IND")q.push({sl:"WP",db:"Google (consulting & industry)",s:webQ(IND_SITES),n:`Open each PDF, check the issuing firm and date, keep ${quota(STREAMS[4],"WP")}. Record the URL.`,url:"https://www.google.com/search?q="+encodeURIComponent(webQ(IND_SITES))});
 if(code==="GOV")q.push({sl:"PP",db:"Google (policy & global organisations)",s:webQ(GOV_SITES),n:`Add your country's ministry/agency domains. Keep ${quota(STREAMS[5],"PP")} position or policy papers; record the URL.`,url:"https://www.google.com/search?q="+encodeURIComponent(webQ(GOV_SITES))});
 const auth=`AU-ID ( <author id> ) AND TITLE-ABS-KEY ( ${boolStr()} )`;
 if(code==="HCR")q.push({sl:"MC/MR",db:"Clarivate Highly Cited Researchers → Scopus",s:auth,n:"Pick the profiles of your field on the HCR list; for each, run this in Scopus and take the most-cited (MC) and most-recent (MR) on-topic paper.",url:"https://clarivate.com/highly-cited-researchers/"});
 if(code==="T2P")q.push({sl:"MC",db:"Stanford–Elsevier Top 2 % → Scopus",s:auth,n:"Filter the list by your subfield; 1 on-topic paper per scientist.",url:"https://elsevier.digitalcommonsdata.com/datasets/btchxktzyw"});
 if(code==="GSP"){const lab=(topicP()||"").toLowerCase().replace(/\s+/g,"_");q.push({sl:"MC/MR",db:"Google Scholar profiles by label",s:"label:"+lab,n:"Opens profiles that list your topic as a label, sorted by citations; take MC (and MR) per profile.",url:"https://scholar.google.com/citations?view_op=search_authors&mauthors="+encodeURIComponent("label:"+lab)})}
 if(code==="RCO")q.push({sl:"MC",db:"Research.com rankings",s:auth,n:"Open the ranking of your discipline; 1 on-topic paper per scientist.",url:"https://research.com/scientists-rankings"});
 if(code==="ADS")q.push({sl:"MC",db:"AD Scientific Index",s:auth,n:"Open the subject ranking; 1 on-topic paper per scientist.",url:"https://www.adscientificindex.com/"});
 if(code==="EMV"){const from=`from_publication_date:${y0}-01-01`,to=`to_publication_date:${y1}-12-31`;
   if(has("RIS"))q.push({sl:"RIS",db:"OpenAlex – rising papers",s:"last 3 years, sorted by citations",n:"Opens raw data (JSON). Save it with Ctrl+S, or import it with the Navigator. Keep papers with the highest citations per year.",url:oaURL({filter:[`from_publication_date:${y1-2}-01-01`,to]})});
   if(has("GLS"))q.push({sl:"GLS",db:"OpenAlex – Global South authors",s:"authors in Africa / South America",n:"Edit the continent list if needed (africa, south_america, asia …).",url:oaURL({filter:[from,to,"authorships.institutions.continent:africa|south_america"]})});
   if(has("REG"))q.push({sl:"REG",db:"OpenAlex – non-English scholarship",s:"language other than English",n:"Keep items you can read or translate reliably.",url:oaURL({filter:[from,to,"language:!en"]})});
   if(has("PRE"))q.push({sl:"PRE",db:"OpenAlex – preprints",s:"type: preprint, newest first",n:"Also check arXiv, SSRN, medRxiv or top conferences of your field.",url:oaURL({filter:[from,to,"type:preprint"],sort:"publication_date:desc"})});
   if(has("CRI"))q.push({sl:"CRI",db:"Scopus – critical & null-result studies",s:scopus(y0,y1,'( barrier* OR challeng* OR failure* OR critique OR "null result*" OR "unintended consequence*" OR resistance )'),n:"Keep studies that dissent, fail or report no effect.",url:"https://www.scopus.com/search/form.uri?display=advanced"})}
 return q}

// ---------------------------------------------------------------- checks
function checks(){const T=TIERS[tier()],u=used(),fam=new Set(u.map(s=>s.f)),out=[];
 const add=(l,t,s)=>out.push({l,t,s});
 add(S.title.trim()?"ok":"bad","Working title",S.title.trim()?"":"Step 1");
 add(blocks().length>=2?"ok":blocks().length===1?"warn":"bad","Search concepts",blocks().length>=2?`${blocks().length} concept blocks`:"Add at least two concept blocks (step 3)");
 const nrq=S.rqs.filter(r=>r.text.trim()).length;add(nrq>=3&&nrq<=5?"ok":nrq>=2?"warn":"bad","Review questions",`${nrq} written · 3–5 recommended`);
 add(u.length>=T.minStreams?"ok":"bad","Evidence streams",`${u.length} chosen · ${tier()} needs ≥ ${T.minStreams}`);
 const grey=fam.has("F3")||fam.has("F4");add(grey?"ok":T.grey?"bad":"warn","Grey literature (industry or policy)",grey?"included":T.grey?"required for "+tier():"recommended");
 add(fam.has("F5")?"ok":tier()==="Lite"?"warn":"bad","Emerging voices (F5)",fam.has("F5")?`quota ${T.f5} of the core`:"needed to counter citation bias");
 if(tier()==="Advanced"){const abc=["A","B","C"].every(a=>u.some(s=>s.a===a));add(abc?"ok":"bad","Approaches A + B + C",abc?"all three":"Advanced needs all three")}
 if(mode()!=="H"&&!u.some(s=>s.a==="B"))add("warn","Influencer streams",`Mode ${mode()} expects at least one B stream`);
 const nc=S.clusters.filter(c=>c.name.trim()).length;add(nc>=3&&nc<=10?"ok":nc>10?"bad":"warn","Keyword clusters",`${nc} · between 3 and 10`);
 const ic=S.inclusion.filter(x=>x.trim()).length,ec=S.exclusion.filter(x=>x.trim()).length;add(ic>=2&&ec>=2?"ok":"warn","Eligibility criteria",`${ic} inclusion · ${ec} exclusion`);
 if(tier()!=="Lite")add(S.secondCoder?"ok":"warn","Second coder (20 %)",S.secondCoder?"planned":"recommended for "+tier());
 if(tier()==="Advanced")add(teamList().length>=3?"ok":"warn","Team of ≥ 3","Advanced tier");
 add(S.registry&&S.registry!=="Not yet"?"ok":tier()==="Advanced"?"bad":"warn","Protocol registration",S.registry&&S.registry!=="Not yet"?S.registry:tier()==="Advanced"?"mandatory for Advanced":"recommended");
 return out}
function familyHarvest(){const h={F1:0,F2:0,F3:0,F4:0,F5:0};used().forEach(s=>(S.streams[s.c].slices||[]).forEach(sl=>h[s.f]+=quota(s,sl)));return h}

// ---------------------------------------------------------------- timeline
function timeline(){const W=+S.weeks||TIERS[tier()].weeks;const base=PHASES.map(p=>p[2]);const tot=base.reduce((a,b)=>a+b,0);
 let w=base.map(b=>Math.max(1,Math.round(b*W/tot)));let diff=W-w.reduce((a,b)=>a+b,0);let i=1;while(diff!==0&&i<200){const k=diff>0?1:(w.indexOf(Math.max(...w)));if(diff>0){w[k]++;diff--}else{if(w[k]>1){w[k]--;diff++}}i++}
 const st=new Date((S.start||nextMonday())+"T00:00:00");let cur=0;return PHASES.map((p,j)=>{const s=cur;cur+=w[j];const a=new Date(st);a.setDate(a.getDate()+s*7);const b=new Date(st);b.setDate(b.getDate()+cur*7-1);
  return {code:p[0],name:p[1],w0:s,w1:cur,weeks:w[j],from:a,to:b}})}
function checkpoints(tl){return [{after:0,t:"CP1 / Key 1 — protocol approved"},{after:3,t:"CP2 / Key 2 — core corpus confirmed"},{after:6,t:"CP3 / Keys 3–4 — findings & synthesis"}].map(c=>({t:c.t,w:tl[c.after].w1,date:tl[c.after].to}))}

 const pct=Math.round(S.step/(STEPS.length-1)*100);$("#mbar").style.width=pct+"%";$("#mlab").textContent=`Step ${S.step} of ${STEPS.length-2>0?STEPS.length-2:0} · ${STEPS[S.step].t}`;if(S.step===0)$("#mlab").textContent="Welcome";if(S.step===STEPS.length-1)$("#mlab").textContent="Your plan";$("#mpct").textContent=pct+"%"}
function health(){const c=checks(),ok=c.filter(x=>x.l==="ok").length,p=c.length?ok/c.length:0;const R=22,C=2*Math.PI*R;
 const h=familyHarvest(),tot=Object.values(h).reduce((a,b)=>a+b,0)||1;
 $("#health").innerHTML=`<div class="hcard"><h4>Plan check</h4><div class="ring"><svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="${R}" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="28" cy="28" r="${R}" fill="none" stroke="var(--good)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 28 28)"/></svg><div><b>${ok} of ${c.length}</b><div class="small muted">${p===1?"Ready to go":"checks met for "+tier()}</div></div></div>
 ${c.map(x=>`<div class="check ${x.l}"><span class="ic">${x.l==="ok"?"✓":x.l==="warn"?"!":"×"}</span><span class="ct">${esc(x.t)}<span class="cs">${esc(x.s)}</span></span></div>`).join("")}</div>
 <div class="hcard"><h4>Planned harvest by family</h4><div class="famsbar">${Object.entries(h).map(([f,v])=>`<i class="${f.toLowerCase()}" style="width:${v/tot*100}%" title="${f} ${v}"></i>`).join("")}</div>
 <div class="famleg">${Object.entries(h).map(([f,v])=>`<span><i class="${f.toLowerCase()}"></i>${f} ${v}</span>`).join("")}</div>
 <p class="small muted" style="margin:8px 0 0">≈ ${Object.values(h).reduce((a,b)=>a+b,0)} records to screen → core ${TIERS[tier()].core}</p></div>`}

function nav(){const last=S.step===STEPS.length-1;return `<div class="nav">${S.step>0?`<button class="btn ghost" data-act="prev">← Back</button>`:"<span></span>"}<span class="step-of">${S.step>0&&!last?`Step ${S.step} of ${STEPS.length-2}`:""}</span>${last?`<button class="btn" data-go="1">Edit answers</button>`:`<button class="btn primary" data-act="next">${S.step===0?"Start planning →":S.step===STEPS.length-2?"See my plan →":"Next →"}</button>`}</div>`}

concepts(){const lab=[["Main topic","The phenomenon you study","e.g. artificial intelligence","artificial intelligence\nmachine learning\ngenerative AI\nChatGPT"],
 ["Context, population or setting","Where or for whom","e.g. higher education","higher education\nuniversit*\ncollege*\nstudent*"],
 ["Focus or outcome","Optional third block — leave empty to keep the search broad","e.g. learning outcomes","learning outcome*\nacademic performance\nengagement"]];
 return `<div class="eyebrow">Step 3 · Search design</div><h2>Key concepts and search terms</h2><p class="lead">Your search is built from 2–3 concept blocks. Inside a block, terms are combined with OR; blocks are combined with AND. Put one term per line; use * for word endings (econom* finds economy, economic …).</p>
${lab.map((l,i)=>`<div class="block"><div class="bh"><span class="bn" style="background:${["var(--f1)","var(--f4)","var(--f2)"][i]}">${i+1}</span><div><b>${l[0]}</b><div class="small muted">${l[1]}</div></div></div>
<div class="row2"><div class="field"><label for="c${i}n">Name it in a few words</label><input id="c${i}n" type="text" data-k="concepts.${i}.name" value="${esc(S.concepts[i].name)}" placeholder="${l[2]}"></div>
<div class="field"><label for="c${i}t">Synonyms and search terms</label><textarea id="c${i}t" rows="6" data-k="concepts.${i}.terms" placeholder="${esc(l[3])}">${esc(S.concepts[i].terms)}</textarea></div></div></div>`).join("")}
<div class="qs"><div class="qh"><b>Preview — Boolean string</b><button class="btn small" data-act="copy" data-copy="bool">Copy</button></div><pre id="boolpv">${esc(boolStr())}</pre></div>
<p class="hint">Tip: 4–10 terms per block is usually right. Too few misses evidence; too many brings noise. You will get a tailored string for every database at the end.</p>
${nav()}`},

rqs(){if(!S.rqs.length)S.rqs=suggestRQs();return `<div class="eyebrow">Step 4 · Review questions</div><h2>Your review questions</h2><p class="lead">Three to five questions, each of a different family, give the review its backbone. We drafted them from your concepts — rewrite them in your own words.</p>
<div class="listed">${S.rqs.map((r,i)=>`<div class="rq"><div class="rqh"><span class="k">RQ${i+1}</span><select aria-label="Family of RQ${i+1}" data-k="rqs.${i}.family">${Object.keys(RQFAM).map(f=>`<option ${r.family===f?"selected":""}>${f}</option>`).join("")}</select><span class="sp"></span><button class="btn link small" data-act="delrq" data-i="${i}" aria-label="Remove RQ${i+1}">Remove</button></div>

${[["navigator","360° MDL Navigator","Claude agent that proposes every step; you confirm with four keys"],["other","Another AI assistant","Allowed with disclosure; you verify every cell against the source"],["none","No AI","Fully manual with the toolkit and the calculator"]].map(o=>`<label class="choice"><input type="radio" name="ai" value="${o[0]}" data-k="ai" data-rerender ${S.ai===o[0]?"checked":""}><b>${o[1]}</b><span>${o[2]}</span></label>`).join("")}</div>

plan(){const tl=timeline(),cps=checkpoints(tl),W=tl[tl.length-1].w1;const tab=S._tab||"get";
 const tabs=[["get","Downloads"],["search","Searches"],["streams","Streams"],["time","Timeline"],["protocol","Protocol"],["next","Next steps"]];
 let body="";
 if(tab==="get")body=`<div class="dls">
  <div class="dl main"><div class="dt">📄 Review protocol (Word)</div><div class="dd">The full Review Canvas T1 with streams, strings, clusters, eligibility, team, AI plan and timeline. Edit it in Word and register it.</div><button class="btn primary" data-act="docx">Download .docx</button></div>
  <div class="dl"><div class="dt">🖨 Protocol as PDF</div><div class="dd">Opens the print dialog — choose “Save as PDF”.</div><button class="btn" data-act="print">Print / Save PDF</button></div>
  <div class="dl"><div class="dt">📊 Pre-filled toolkit (Excel)</div><div class="dd">The official 360° MDL toolkit (T1–T17) with your canvas, tier and planned searches already filled in. All formulas intact.</div><button class="btn" data-act="xlsx">Download .xlsx</button></div>
  <div class="dl"><div class="dt">🤖 File for the Navigator</div><div class="dd">Upload it to Claude with the 360° MDL Navigator and say “Start my review from this plan”.</div><button class="btn" data-act="navjson">Download .json</button></div>
  <div class="dl"><div class="dt">💾 Save this plan</div><div class="dd">Keep a copy to reopen on another computer (Welcome → Open a saved plan).</div><button class="btn" data-act="savejson">Save plan</button></div>
 </div><div class="note">Your plan scores <b>${checks().filter(c=>c.l==="ok").length} of ${checks().length}</b> checks for ${tier()}. ${checks().some(c=>c.l==="bad")?"Fix the red items in the panel before you register the protocol.":"You are ready to register the protocol and start searching."}</div>`;
 if(tab==="search"){const qs=used().flatMap(s=>queriesFor(s.c).map(q=>Object.assign({code:s.c,f:s.f},q)));

 if(S.ai!=="none"){set("A90",S.ai==="navigator"?"360° MDL Navigator v0.1 (Claude, Anthropic)":(S.aiTool||"AI assistant"));set("B90","Search strings, screening proposals, 6R proposals, coding, drafting");set("C90","Researcher confirms every step (Two-Key Rule)");set("D90",S.ai==="navigator"?"audit_log.jsonl":"Prompt log in project folder")}
 let r=5;used().forEach(s=>queriesFor(s.c).forEach(q=>{if(r>44)return;const S3=(c,v)=>{s3=setCell(s3,c+r,v)};S3("B",s.c);S3("E",q.sl.split("/")[0]);S3("F",q.db);S3("H",q.s);S3("I",`${S.y0}–${S.y1}; ${S.languages.join(", ")}`);S3("L","PLANNED — "+q.n);r++}));
 z.file("xl/worksheets/sheet1.xml",s1);z.file("xl/worksheets/sheet2.xml",s2);z.file("xl/worksheets/sheet3.xml",s3);
 // drop cached formula results so Excel and LibreOffice both recompute everything from the new inputs
 for(const n of Object.keys(z.files).filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n))){const x=await z.file(n).async("string");z.file(n,x.replace(/(<f[^>]*>[^<]*<\/f>|<f[^>]*\/>)<v>[^<]*<\/v>/g,"$1"))}
 let wb=await z.file("xl/workbook.xml").async("string");wb=wb.replace(/<calcPr([^>]*?)\s*\/>/,(m,a)=>`<calcPr${a.replace(/\s*fullCalcOnLoad="[^"]*"/,"")} fullCalcOnLoad="1"/>`);z.file("xl/workbook.xml",wb);
 return z.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",compression:"DEFLATE"})}

// ---------------------------------------------------------------- JSON exports
function navigatorJSON(){const T=TIERS[tier()];return {
 _about:"360° MDL plan for the Navigator. Upload to Claude with the 360° MDL Navigator and say: Start my review from this plan.",
 generator:"360° MDL Review Starter v1.0", created:new Date().toISOString(),
 canvas:{title:S.title,purpose:S.topic,rationale:S.rationale,rqs:S.rqs.filter(r=>r.text.trim()).map(r=>({text:r.text,family:r.family})),
  window:`${S.y0}–${S.y1}`,languages:S.languages.join(", "),disciplines:S.discipline,doctypes:S.doctypes.join("; "),
  registry:S.registry,calibration:S.secondCoder?"Second coder, 20 % sample, κ ≥ 0.70":"Supervisor checkpoints",update:`Re-run Recency slice every ${S.update} months`,
  inclusion:S.inclusion.filter(x=>x.trim()),exclusion:S.exclusion.filter(x=>x.trim()),tier:tier(),mode:mode(),
  team:teamList().map(m=>[m.name,m.role,"","",m.contact,""]),
  matrices:Object.fromEntries(Object.keys(MATRICES).map(m=>[m,[T.matrices.includes(m)?"Y":"N",""]]))},
 streams:Object.fromEntries(STREAMS.map(s=>{const st=S.streams[s.c]||{use:false,slices:[]};return [s.c,st.use?{use:"Y",slices:st.slices,note:"planned with the Review Starter"}:{use:"N"}]})),
 clusters:S.clusters.filter(c=>c.name.trim()),
 concepts:S.concepts.filter(c=>terms(c.terms).length).map(c=>({name:c.name,terms:terms(c.terms)})),
 log:used().flatMap(s=>queriesFor(s.c).map(q=>({code:s.c,slice:q.sl,source:q.db,date:"",query:q.s,filters:`${S.y0}–${S.y1}`,hits:null,exported:null,notes:q.n,status:"planned"})))}}
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function fname(ext){const b=(S.title||"360MDL_plan").replace(/[^\p{L}\p{N}]+/gu,"_").replace(/^_|_$/g,"").slice(0,50)||"360MDL_plan";return `360MDL_${b}.${ext}`}

// ---------------------------------------------------------------- example
function example(){S=Object.assign(blank(),{step:1,title:"Generative AI in higher education: adoption, outcomes and governance — a 360° MDL review",
 topic:"How universities adopt generative AI for teaching, learning and assessment, what outcomes are reported, and how institutions govern its use.",
 purpose:"journal",discipline:"Education",author:"Your Name",affiliation:"Your University",tier:"Standard",mode:"H",
 rationale:"Evidence on generative AI in universities is growing fast but is scattered across education, computing and policy outlets, and across academic, institutional and industry sources. Existing reviews cover single databases and early 2023 studies; no review triangulates academic, policy and emerging evidence or tests how robust the findings are.",
 concepts:[{name:"generative AI",terms:"generative AI\nChatGPT\nlarge language model*\nAI chatbot*\nGPT-4"},{name:"higher education",terms:"higher education\nuniversit*\ncollege*\nundergraduate*\npostgraduate*"},{name:"",terms:""}],
 y0:YEAR-4,y1:YEAR,start:nextMonday()});go(1)}

// ---------------------------------------------------------------- events
document.addEventListener("click",async e=>{const t=e.target.closest("[data-go],[data-act],[data-tab]");if(!t)return;
 if(t.dataset.go!=null){go(+t.dataset.go);return}
 if(t.dataset.tab){S._tab=t.dataset.tab;save();render();return}
 const a=t.dataset.act;
 if(a==="next"){go(S.step+1)}
 else if(a==="prev"){go(S.step-1)}
 else if(a==="example"){example();toast("Example loaded — change anything you like")}
 else if(a==="reset"){if(confirm("Start a new plan? Your current answers will be cleared from this browser (save the plan first if you need it).")){S=blank();save();render(true)}}
 else if(a==="addrq"){S.rqs.push({family:"How (design)",text:""});save();render()}
 else if(a==="delrq"){S.rqs.splice(+t.dataset.i,1);save();render()}
 else if(a==="regenrq"){if(!S.rqs.some(r=>r.text.trim())||confirm("Replace your questions with new drafts?")){S.rqs=suggestRQs();save();render()}}
 else if(a==="addcl"){S.clusters.push({name:"",keywords:""});save();render()}
 else if(a==="regencl"){if(confirm("Replace your clusters with new drafts?")){S.clusters=suggestClusters();save();render()}}
 else if(a==="addlist"){S[t.dataset.l].push("");save();render()}
 else if(a==="dellist"){S[t.dataset.l].splice(+t.dataset.i,1);save();render()}
 else if(a==="addteam"){S.team.push({name:"",role:S.team.length===1&&tier()!=="Lite"?"Second coder":"Co-reviewer",contact:""});save();render()}
 else if(a==="resetstreams"){S.streamsTouched=false;applyStreamDefaults();save();render()}
 else if(a==="copy"){const id=t.dataset.copy;const txt=id==="bool"?boolStr():($("#"+id)||{}).textContent||"";try{await navigator.clipboard.writeText(txt);toast("Copied")}catch(err){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Copied")}catch(x){toast("Select the text and copy it")}ta.remove()}}
 else if(a==="docx"){try{dl(await makeDocx(),fname("docx"));toast("Protocol downloaded")}catch(err){console.error(err);toast("Could not build the Word file")}}
 else if(a==="xlsx"){try{dl(await makeXlsx(),fname("xlsx").replace("360MDL_","360MDL_Toolkit_"));toast("Toolkit downloaded")}catch(err){console.error(err);toast("Could not build the toolkit")}}
 else if(a==="navjson"){dl(new Blob([JSON.stringify(navigatorJSON(),null,1)],{type:"application/json"}),fname("json").replace("360MDL_","360MDL_Navigator_"));toast("Navigator file downloaded")}
 else if(a==="savejson"){const o=Object.assign({},S);delete o._tab;dl(new Blob([JSON.stringify(o,null,1)],{type:"application/json"}),fname("json").replace("360MDL_","360MDL_StarterPlan_"));toast("Plan saved")}
 else if(a==="print"){$("#print").innerHTML=protocolHTML(true);setTimeout(()=>window.print(),50)}
});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.act==="open"&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o&&o.v===1){S=Object.assign(blank(),o);S.step=1;save();render(true);toast("Plan opened")}else toast("This is not a Starter plan file")}catch(x){toast("Could not read the file")}};r.readAsText(t.files[0]);return}
 if(t.dataset.stream){const c=t.dataset.stream;const s=STREAMS.find(x=>x.c===c);S.streams[c]=S.streams[c]||{use:false,slices:[]};S.streams[c].use=t.checked;if(t.checked&&!S.streams[c].slices.length)S.streams[c].slices=Object.keys(s.sl).filter(k=>s.sl[k]).slice(0,3);S.streamsTouched=true;save();render();return}
 if(t.dataset.slice){const st=S.streams[t.dataset.slice];const v=t.value;st.slices=t.checked?[...new Set([...st.slices,v])]:st.slices.filter(x=>x!==v);S.streamsTouched=true;save();health();return}
 if(t.dataset.arr){const k=t.dataset.arr;S[k]=t.checked?[...new Set([...S[k],t.value])]:S[k].filter(x=>x!==t.value);save();health();return}
 if(t.dataset.bool){S[t.dataset.bool]=t.checked;save();health();return}
 if(t.dataset.k&&(t.type==="radio"||t.tagName==="SELECT"||t.type==="date"||t.dataset.rerender!=null))onInput(t,true)});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.k&&t.type!=="radio"&&t.tagName!=="SELECT")onInput(t,false)});
function onInput(t,commit){let v=t.value;if(t.dataset.num!=null){v=parseInt(v,10);if(isNaN(v))return}
 setPath(S,t.dataset.k,v);
 if(t.dataset.k==="purpose"&&!S.tierTouched){S.tier={thesis:"Lite",journal:"Standard",flagship:"Advanced"}[v]}
 if(t.dataset.k==="tier"){S.tierTouched=true;if(v==="Advanced")S.mode="360";if(!S.streamsTouched)applyStreamDefaults()}
 if(t.dataset.k==="purpose"&&!S.streamsTouched)applyStreamDefaults();
 if(t.dataset.k==="mode"&&!S.streamsTouched)applyStreamDefaults();
 if(t.dataset.k.startsWith("concepts")){const p=$("#boolpv");if(p)p.textContent=boolStr()}
 saveSoon();health();if(t.dataset.rerender!=null&&commit)render()}

// ---------------------------------------------------------------- start
load();if(!S.tier&&S.purpose)S.tier={thesis:"Lite",journal:"Standard",flagship:"Advanced"}[S.purpose];render(false);

</script>
